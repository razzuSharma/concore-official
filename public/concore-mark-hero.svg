<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
<defs>
<radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#14B8A6" stop-opacity="0.55"></stop>
<stop offset="55%" stop-color="#14B8A6" stop-opacity="0.14"></stop>
<stop offset="100%" stop-color="#14B8A6" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="accentHalo" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#FF4D00" stop-opacity="0.7"></stop>
<stop offset="60%" stop-color="#FF4D00" stop-opacity="0.18"></stop>
<stop offset="100%" stop-color="#FF4D00" stop-opacity="0"></stop>
</radialGradient>
<filter id="dotDepth" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0c0c0a" flood-opacity="0.16"></feDropShadow>
</filter>
<filter id="accentGlow" x="-120%" y="-120%" width="340%" height="340%">
<feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF4D00" flood-opacity="0.9"></feDropShadow>
</filter>
<style>
.halo-core { transform-box: fill-box; transform-origin: center; animation: breathe 4.6s ease-in-out infinite; }
.halo-accent { transform-box: fill-box; transform-origin: center; animation: breathe 2.9s ease-in-out infinite; }
.core-dot { transform-box: fill-box; transform-origin: center; animation: pulse 4.6s ease-in-out infinite; }
.accent-dot { transform-box: fill-box; transform-origin: center; animation: pulse 2.9s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(0.82); opacity: 0.5; } 50% { transform: scale(1.12); opacity: 0.95; } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) {
.halo-core, .halo-accent, .core-dot, .accent-dot { animation: none; }
.halo-core { opacity: 0.7; }
.halo-accent { opacity: 0.7; }
}
</style>
</defs>
